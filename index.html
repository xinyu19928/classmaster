<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#7c3aed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="班主任" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="application-name" content="班主任管理工作台" />
<meta name="description" content="一站式班主任管理工具,涵盖学生管理、成绩分析、违纪统计、作业、请假、排座位、家校沟通等核心功能" />
<meta name="format-detection" content="telephone=no" />

<!-- PWA 图标与清单 -->
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />

<!-- iOS 启动画面(可选,简化版) -->
<meta name="apple-mobile-web-app-capable" content="yes" />

<!-- Open Graph -->
<meta property="og:title" content="班主任管理工作台" />
<meta property="og:description" content="一站式班级管理工具 - 可添加到主屏幕离线使用" />
<meta property="og:image" content="/icons/icon-512.png" />

<title>班主任管理工作台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{
    --bg:#f8f6fc;
    --sidebar:#1a1025;
    --sidebar-hover:#2d1b3d;
    --primary:#7c3aed;
    --primary-light:#8b5cf6;
    --accent:#a78bfa;
    --success:#10b981;
    --warning:#f59e0b;
    --danger:#ef4444;
    --text:#1e1b2e;
    --muted:#7c7794;
    --border:#e8e4f0;
  }
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);margin:0;height:100vh;overflow:hidden}
  .layout{display:flex;height:100vh}
  /* sidebar */
  .sidebar{width:240px;background:var(--sidebar);color:#e2e8f0;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto}
  .sidebar::-webkit-scrollbar{width:6px}
  .sidebar::-webkit-scrollbar-thumb{background:#475569;border-radius:3px}
  .brand{padding:18px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #334155}
  .brand-logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#7c3aed);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:18px}
  .brand-text .t1{font-weight:600;color:#fff}
  .brand-text .t2{font-size:12px;color:#94a3b8}
  .nav{padding:12px 8px;flex:1}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:8px;cursor:pointer;color:#cbd5e1;font-size:14px;margin:2px 0;transition:all .15s}
  .nav-item:hover{background:#334155;color:#fff}
  .nav-item.active{background:#7c3aed;color:#fff}
  .nav-item i{width:18px;text-align:center}
  .nav-group{position:relative}
  .nav-group .children{margin-left:14px;border-left:1px solid #334155;display:none}
  .nav-group.open .children{display:block}
  .nav-group .caret{margin-left:auto;transition:transform .2s}
  .nav-group.open .caret{transform:rotate(90deg)}
  .nav-group .nav-item{padding:7px 14px;font-size:13px;color:#94a3b8}
  .nav-group .nav-item.active{background:transparent;color:#fff;font-weight:500}
  .sidebar-foot{padding:14px 16px;border-top:1px solid #334155;font-size:12px;color:#64748b}
  /* main */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0}
  .topbar .menu-toggle{display:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .topbar .title{font-size:18px;font-weight:600}
  .topbar .date{margin-left:auto;color:var(--muted);font-size:14px}
  .content{flex:1;overflow-y:auto;padding:20px 24px;background:var(--bg)}
  .content::-webkit-scrollbar{width:8px}
  .content::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  /* cards */
  .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);border:1px solid var(--border)}
  .card-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  /* stat cards */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .stat{background:#fff;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;border:1px solid var(--border)}
  .stat .ic{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px}
  .stat .label{color:var(--muted);font-size:13px}
  .stat .num{font-size:24px;font-weight:700;line-height:1.2}
  .stat .unit{font-size:12px;color:var(--muted)}
  /* shortcut grid */
  .shortcut-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .shortcut{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 8px;text-align:center;cursor:pointer;transition:all .15s}
  .shortcut:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .shortcut i{font-size:24px;color:var(--primary);margin-bottom:6px;display:block}
  .shortcut span{font-size:13px;color:var(--text)}
  /* table */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:#f1f5f9;text-align:left;padding:10px 12px;color:var(--muted);font-weight:500;font-size:13px;border-bottom:1px solid var(--border)}
  td{padding:10px 12px;border-bottom:1px solid #f1f5f9}
  tr:hover{background:#f8fafc}
  .badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px}
  .badge-blue{background:#ede9fe;color:#7c3aed}
  .badge-green{background:#d1fae5;color:#059669}
  .badge-yellow{background:#fef3c7;color:#d97706}
  .badge-red{background:#fee2e2;color:#dc2626}
  .badge-gray{background:#f1f5f9;color:#475569}
  /* buttons */
  .btn{padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:#6d28d9}
  .btn-success{background:var(--success);color:#fff}
  .btn-warning{background:var(--warning);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{background:#f8fafc}
  .btn-sm{padding:4px 10px;font-size:12px}
  /* forms */
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
  .form-control{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff}
  .form-control:focus{outline:none;border-color:var(--primary-light)}
  /* modal */
  .modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto}
  .modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .modal-header h3{font-size:16px;font-weight:600;margin:0}
  .modal-body{padding:20px}
  .modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  /* progress */
  .progress{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:3px}
  /* chart container */
  .chart-container{position:relative;height:280px;width:100%}
  .chart-container canvas{position:absolute!important;left:0;top:0;width:100%!important;height:100%!important}
  /* utility */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .text-muted{color:var(--muted)}
  .flex{display:flex}
  .flex-between{display:flex;justify-content:space-between;align-items:center}
  .gap-2{gap:8px}
  .gap-3{gap:12px}
  .mb-2{margin-bottom:8px}
  .mb-3{margin-bottom:12px}
  .mb-4{margin-bottom:16px}
  .mt-2{margin-top:8px}
  .mt-3{margin-top:12px}
  .mt-4{margin-top:16px}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar .search{flex:1;min-width:200px;position:relative}
  .toolbar .search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .toolbar .search input{padding-left:32px}
  /* step indicator */
  .steps{display:flex;justify-content:space-between;margin-bottom:24px;position:relative}
  .steps::before{content:'';position:absolute;top:14px;left:5%;right:5%;height:2px;background:var(--border);z-index:0}
  .step{position:relative;z-index:1;background:#fff;padding:0 8px;display:flex;flex-direction:column;align-items:center;flex:1}
  .step .dot{width:30px;height:30px;border-radius:50%;background:#e2e8f0;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;margin-bottom:4px}
  .step.active .dot{background:var(--primary);color:#fff}
  .step.done .dot{background:var(--success);color:#fff}
  .step .label{font-size:12px;color:var(--muted)}
  .step.active .label,.step.done .label{color:var(--text);font-weight:500}
  /* seating */
  .seating-board{background:#f8fafc;border-radius:12px;padding:24px;position:relative;min-height:500px}
  .blackboard{background:#1e293b;color:#fff;text-align:center;padding:10px;border-radius:6px;margin:0 auto 20px;width:60%;font-size:14px;letter-spacing:8px}
  .seat-row{display:flex;justify-content:center;gap:12px;margin-bottom:12px}
  .seat{width:90px;height:70px;background:#fff;border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:13px;position:relative}
  .seat:hover{transform:scale(1.05);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .seat.assigned{background:linear-gradient(135deg,#ede9fe,#e0e7ff);border-color:#93c5fd}
  .seat .name{font-weight:600;color:var(--text)}
  .seat .id{font-size:11px;color:var(--muted)}
  .seat-empty{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#e2e8f0 6px,#e2e8f0 12px);color:#94a3b8}
  /* timeline */
  .timeline{position:relative;padding-left:24px}
  .timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
  .tl-item{position:relative;padding-bottom:18px}
  .tl-item::before{content:'';position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .tl-date{font-size:12px;color:var(--muted)}
  .tl-title{font-weight:500;margin:2px 0}
  .tl-content{font-size:13px;color:var(--muted)}
  /* responsive */
  @media(max-width:1024px){
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .shortcut-grid{grid-template-columns:repeat(3,1fr)}
    .grid-2,.grid-3{grid-template-columns:1fr}
  }
  @media(max-width:768px){
    .sidebar{position:fixed;left:-240px;top:0;bottom:0;z-index:200;transition:left .2s}
    .sidebar.open{left:0}
    .topbar .menu-toggle{display:block}
    .stat-grid{grid-template-columns:1fr 1fr}
    .shortcut-grid{grid-template-columns:repeat(2,1fr)}
  }
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
  .toast{position:fixed;top:20px;right:20px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;z-index:2000;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:slideIn .2s}
  @keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty i{font-size:32px;margin-bottom:8px;display:block}

  /* 爆款视频网格 */
  .hotvideo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .hot-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:all .2s}
  .hot-card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
  .hot-cover{position:relative;aspect-ratio:16/9;background:#f1f5f9;overflow:hidden}
  .hot-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .hot-rank{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
  .hot-rank.top3{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
  .hot-duration{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;padding:2px 6px;border-radius:4px;font-size:11px}
  .hot-info{padding:10px 12px}
  .hot-title{font-size:14px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;min-height:38px}
  .hot-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
  .hot-tag{display:inline-block;padding:1px 6px;background:#ede9fe;color:#7c3aed;border-radius:4px;font-size:11px}
  .hot-stats{display:flex;gap:12px;font-size:12px;color:var(--muted)}
  .hot-stats i{margin-right:2px}

  /* 新闻列表 */
  .news-item{display:flex;gap:12px;padding:14px 12px;border-bottom:1px solid #f1f5f9;cursor:pointer;transition:background .15s;align-items:flex-start}
  .news-item:hover{background:#f8fafc}
  .news-item:last-child{border-bottom:none}
  .news-rank{width:28px;height:28px;flex-shrink:0;border-radius:6px;background:#f1f5f9;color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
  .news-item:nth-child(1) .news-rank{background:linear-gradient(135deg,#fee2e2,#fecaca);color:#dc2626}
  .news-item:nth-child(2) .news-rank{background:linear-gradient(135deg,#fed7aa,#fdba74);color:#ea580c}
  .news-item:nth-child(3) .news-rank{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#d97706}
  .news-body{flex:1;min-width:0}
  .news-title{font-size:14px;font-weight:500;line-height:1.5;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .news-foot{display:flex;align-items:center;gap:10px;font-size:12px;flex-wrap:wrap}
  .news-arrow{color:#cbd5e1;align-self:center;flex-shrink:0}

  /* iOS 顶部安全区 */
  @supports(padding-top:env(safe-area-inset-top)){
    .topbar{padding-top:env(safe-area-inset-top);height:calc(60px + env(safe-area-inset-top))}
    body{padding-bottom:env(safe-area-inset-bottom)}
  }

  /* PWA 独立模式下的微调 */
  @media (display-mode:standalone){
    .topbar{padding-top:max(env(safe-area-inset-top),14px)}
  }
</style>
</head>
<body>
<div class="layout">
  <!-- sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">班</div>
      <div class="brand-text">
        <div class="t1" id="className">初三(3)班</div>
        <div class="t2" id="teacherInfo">王老师 · 45人</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="nav-item" data-page="data"><i class="fa-solid fa-database"></i><span>数据管理</span></div>
      <div class="nav-item" data-page="settings"><i class="fa-solid fa-gear"></i><span>系统设置</span></div>
    </div>
  </aside>
  <!-- main -->
  <div class="main">
    <header class="topbar">
      <i class="fa-solid fa-bars menu-toggle" id="menuToggle"></i>
      <div class="title" id="pageTitle">仪表盘</div>
      <div class="date" id="todayDate"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<!-- modal -->
<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <i class="fa-solid fa-xmark" style="cursor:pointer;color:#94a3b8" onclick="closeModal()"></i>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
/* ===================== 数据层 ===================== */
const STORAGE_KEY = 'classmaster_v1';
const DEFAULT_STATE = {
  classInfo: { name: '初三(3)班', teacher: '王老师', count: 45 },
  students: [],
  exams: [],
  violations: [],
  homework: [],
  leaves: [],
  works: [],
  talks: [],
  seats: {},          // {row:col: studentId}
  parents: [],
  activities: [],
  todos: [],
  notes: []
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
  }catch(e){console.warn(e)}
  return seedData(JSON.parse(JSON.stringify(DEFAULT_STATE)));
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function uid(){return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ===================== 预置演示数据 ===================== */
function seedData(s){
  s.classInfo = { name: '初三(3)班', teacher: '王老师', count: 45 };
  const surnames = ['韩','贾','苏','萧','刘','张','程','孙','陈','杨','赵','钱','李','吴','黄','周','林','何','高','马','罗','梁','宋','郑','冯','蒋','沈','韩','杨','朱','秦','尤','许','何','吕','施','张','孔','曹','严','华','金','魏','陶','姜'];
  const givens = ['雪','勇','娜','超','悦','华','霞','秀兰','志强','晓东','红','建国','磊','婷','静','文博','雅','天宇','浩然','梓涵','诗琪','一鸣','俊','雅琴','博文','欣怡','浩','明','建国','海','燕','亮','俊','晓','悦','萌','佳怡','晨','阳','思源','凌','雨','悦','雯','丽','华'];
  const genders = ['男','女'];
  s.students = [];
  for(let i=1;i<=45;i++){
    const sn = surnames[(i*7)%surnames.length];
    const gn = givens[(i*13)%givens.length] + (i%2===0?givens[(i*5)%givens.length]:'');
    s.students.push({
      id: 'S'+String(i).padStart(3,'0'),
      name: sn+gn,
      gender: i%2===0?'女':'男',
      studentNo: '202400'+String(i).padStart(2,'0'),
      idCard: '32010520090'+String(1000+i),
      birth: '2009-0'+(1+i%9)+'-'+String(1+i%28).padStart(2,'0'),
      address: '南京市鼓楼区'+['中央路','中山路','北京路','上海路','广州路'][i%5]+(100+i)+'号',
      parentName: ['李父','王母','张父','刘母','陈父','杨母','黄父','赵母'][i%8],
      parentPhone: '139'+String(10000000+i).slice(-8),
      dorm: i%5===0?'寄宿':'走读',
      position: i%3===0?'班委':'学生',
      remark: ''
    });
  }
  // 考试
  const subjects = ['语文','数学','英语','物理','政治','历史'];

function buildNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGES.filter(p=>!['data','settings'].includes(p.key)).map(p=>{
    if(p.group){
      return `<div class="nav-group" data-group="${p.key}">
        <div class="nav-item" onclick="toggleGroup('${p.key}')">
          <i class="fa-solid ${p.icon}"></i><span>${p.name}</span>
          <i class="fa-solid fa-chevron-right caret"></i>
        </div>
        <div class="children">
          ${p.children.map(c=>`<div class="nav-item" data-page="${c.key}"><span>${c.name}</span></div>`).join('')}
        </div>
      </div>`;
    }
    return `<div class="nav-item" data-page="${p.key}"><i class="fa-solid ${p.icon}"></i><span>${p.name}</span></div>`;
  }).join('');
  nav.querySelectorAll('.nav-item[data-page]').forEach(el=>{
    el.onclick = ()=>goPage(el.dataset.page);
  });
}

function toggleGroup(key){
  const el = document.querySelector(`[data-group="${key}"]`);
  el.classList.toggle('open');
}

function goPage(pageKey){
  currentPage = pageKey;
  currentSubPage = pageKey;
  // 关闭所有 group 高亮
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-group').forEach(el=>el.classList.remove('open'));
  // 找页面
  let page = PAGES.find(p=>p.key===pageKey);
  let parent = null;
  if(!page){
    for(const p of PAGES){
      if(p.children){
        const c = p.children.find(c=>c.key===pageKey);
        if(c){page = c; parent = p; break;}
      }
    }
  }
  if(!page) return;
  // 高亮
  if(parent){
    document.querySelector(`[data-group="${parent.key}"]`).classList.add('open');
    document.querySelector(`[data-group="${parent.key}"] .nav-item[data-page="${page.key}"]`).classList.add('active');
  }else{
    const item = document.querySelector(`.sidebar > .nav > .nav-item[data-page="${page.key}"]`);
    if(item) item.classList.add('active');
    const foot = document.querySelector(`.sidebar-foot .nav-item[data-page="${page.key}"]`);
    if(foot) foot.classList.add('active');
  }
  document.getElementById('pageTitle').textContent = page.name;
  page.render();
  // 移动端关闭sidebar
  document.getElementById('sidebar').classList.remove('open');
}

function findPage(key){
  for(const p of PAGES){
    if(p.key===key) return p;
    if(p.children){
      const c = p.children.find(c=>c.key===key);
      if(c) return c;
    }
  }
  return null;
}

function renderTopThree(exam){

  </tbody></table>`;
}

function todayStr(){return new Date().toISOString().slice(0,10)}
function isThisWeek(d){
  const dt = new Date(d);
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate()-now.getDay());
  return dt >= start && dt <= now;
}

function getCheckedSids(){

  document.querySelectorAll('.stu-check:checked').forEach(cb=>sids.push(cb.dataset.sid));

}
function updateBatchDelBtn(){
  const count = getCheckedSids().length;
  const btn = document.getElementById('btnBatchDel');
  const cnt = document.getElementById('batchDelCount');
  if(btn){
    btn.style.display = count>0?'':'none';
    if(cnt) cnt.textContent = count;
  }
}
function batchDelStu(){
  const sids = getCheckedSids();
  if(sids.length===0){showToast('请先勾选要删除的学生');return}
  if(!confirm(`确定删除选中的 ${sids.length} 名学生吗？此操作不可恢复！`))return;
  state.students = state.students.filter(s=>!sids.includes(s.id));
  saveState();renderStudentsList();showToast(`已删除 ${sids.length} 名学生`);
}
function batchImportStu(){
  const file = document.getElementById('stuBatchFile').files[0];
  if(!file)return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws);
      let count = 0;
      const newStudents = [];
      rows.forEach(r=>{
        if(!r['姓名'])return;
        const id = 'S'+String(state.students.length+newStudents.length+1).padStart(3,'0');
        newStudents.push({
          id,
          studentNo: String(r['学号']||''),
          name: String(r['姓名']),
          gender: r['性别']||'男',
          birth: r['出生日期']||'',
          idCard: String(r['身份证号']||''),
          parentName: String(r['家长姓名']||''),
          parentPhone: String(r['家长电话']||''),
          address: String(r['家庭住址']||''),
          dorm: r['住宿']||'走读',
          position: r['职务']||'学生',
          remark: ''
        });
        count++;
      });
      if(count===0){showToast('未识别到有效数据,请检查 Excel 格式');return}
      state.students.push(...newStudents);
      saveState();renderStudentsList();showToast(`成功导入 ${count} 名学生`);
    }catch(err){showToast('导入失败,请检查文件格式')}
  };
  reader.readAsBinaryString(file);
  document.getElementById('stuBatchFile').value = '';
}

function saveStu(sid){
  const data = {
    studentNo: document.getElementById('f_stuNo').value,
    name: document.getElementById('f_name').value,
    gender: document.getElementById('f_gender').value,
    idCard: document.getElementById('f_idCard').value,

    dorm: document.getElementById('f_dorm').value,
    parentName: document.getElementById('f_pname').value,

    address: document.getElementById('f_addr').value,
    position: document.getElementById('f_pos').value,
    remark: document.getElementById('f_remark').value,
  };
  if(!data.name){showToast('请输入姓名');return}
  if(sid){
    Object.assign(getStudent(sid), data);

function saveExam(){
  const name = document.getElementById('e_name').value;
  const date = document.getElementById('e_date').value;
  const subjects = document.getElementById('e_subjects').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  if(!name){showToast('请输入考试名称');return}
  const id = 'E'+Date.now();
  state.exams.push({
    id, name, date, subjects,
    scores: state.students.map(stu=>{
      const obj = {sid:stu.id, name:stu.name};
      subjects.forEach(sub=>{obj[sub]=0});
      obj.total = 0; obj.rank = 0;
      return obj;
    })
  });
  saveState();renderScoreExamList();closeModal();showToast('考试已创建');
}
function delExam(eid){
  if(!confirm('确定删除该考试?所有成绩数据将丢失'))return;
  state.exams = state.exams.filter(e=>e.id!==eid);
  saveState();renderScoreExamList();showToast('已删除');
}

function importScoreExcel(){
  const file = document.getElementById('scoreFile').files[0];
  if(!file)return;
  const eid = document.getElementById('examSel').value;
  const exam = state.exams.find(e=>e.id===eid);
  const reader = new FileReader();
  reader.onload = e=>{
    const wb = XLSX.read(e.target.result,{type:'binary'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws);
    rows.forEach(r=>{
      const sc = exam.scores.find(s=>s.name===r['姓名']);
      if(!sc)return;
      exam.subjects.forEach(sub=>{if(r[sub]!==undefined) sc[sub] = Number(r[sub])});
      sc.total = exam.subjects.reduce((s,k)=>s+(sc[k]||0),0);
    });
    const sorted = [...exam.scores].sort((a,b)=>b.total-a.total);
    sorted.forEach((sc,i)=>sc.rank=i+1);
    saveState();renderScoreInput();showToast('导入成功');
  };
  reader.readAsBinaryString(file);
}

function renderTrendChart(){
  // 等待布局完成后再渲染
  requestAnimationFrame(()=>{
  const sid = document.getElementById('trendStu').value;
  const stu = getStudent(sid);
  const datasets = [
    {label:'总分', data:state.exams.map(e=>e.scores.find(s=>s.sid===sid)?.total||0), borderColor:'#7c3aed', backgroundColor:'#ede9fe', yAxisID:'y', tension:0.3},
    {label:'排名', data:state.exams.map(e=>e.scores.find(s=>s.sid===sid)?.rank||0), borderColor:'#ef4444', backgroundColor:'#fee2e2', yAxisID:'y1', tension:0.3}
  ];
  if(window.trendChart) window.trendChart.destroy();
  window.trendChart = new Chart(document.getElementById('trendChart'), {
    type:'line',
    data:{labels:state.exams.map(e=>e.name), datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      scales:{
        y:{position:'left',beginAtZero:false,title:{display:true,text:'总分'}},
        y1:{position:'right',reverse:true,title:{display:true,text:'排名'},grid:{display:false}}
      }
    }
  });
  // 表格
  const tbody = document.querySelector('#trendTable tbody');
  tbody.innerHTML = state.exams.map((e,i)=>{
    const sc = e.scores.find(s=>s.sid===sid);
    if(!sc) return '';
    let trend = '-';
    if(i>0){
      const prev = state.exams[i-1].scores.find(s=>s.sid===sid);
      if(prev){
        const diff = sc.total - prev.total;
        if(diff>0) trend = `<span class="badge badge-green">↑ ${diff}</span>`;
        else if(diff<0) trend = `<span class="badge badge-red">↓ ${Math.abs(diff)}</span>`;
        else trend = `<span class="badge badge-gray">— 0</span>`;
      }
    }
    return `<tr><td>${e.name}</td>${e.subjects.map(sub=>`<td>${sc[sub]||0}</td>`).join('')}<td><strong>${sc.total}</strong></td><td>第${sc.rank}名</td><td>${trend}</td></tr>`;
  }).join('');
  });
}

          <button class="btn btn-outline" onclick="clearSeat()"><i class="fa-solid fa-eraser"></i>清空</button>
          <button class="btn btn-success" onclick="exportSeatImg()"><i class="fa-solid fa-image"></i>导出图片</button>
        </div>
      </div>
      <div class="text-muted mb-3">提示:点击空白座位可分配学生,点击已分配座位可移除</div>
      <div class="seating-board" id="seatBoard">
        <div class="blackboard">讲 台</div>
        ${Array.from({length:rows},(_,r)=>`
          <div class="seat-row">
            ${Array.from({length:cols},(_,c)=>{
              const key = r+'_'+c;
              const sid = state.seats[key];
              const stu = sid?getStudent(sid):null;
              return `<div class="seat ${stu?'assigned':''} ${!stu?'seat-empty':''}" onclick="editSeat(${r},${c})">
                ${stu?`<div class="name">${stu.name}</div><div class="id">${stu.id}</div>`:'空座'}
              </div>`;
            }).join('')}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}
function editSeat(r,c){
  const key = r+'_'+c;
  const cur = state.seats[key];
  const body = `
    <div class="form-group"><label>分配学生</label>
      <select class="form-control" id="seat_sel">
        <option value="">空座</option>
        ${state.students.map(s=>`<option value="${s.id}" ${cur===s.id?'selected':''}>${s.name}</option>`).join('')}
      </select>
    </div>
  `;
  openModal(`座位 (第${r+1}排第${c+1}列)`, body, `<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveSeat(${r},${c})">保存</button>`);
}
function saveSeat(r,c){
  const v = document.getElementById('seat_sel').value;
  const key = r+'_'+c;
  if(v) state.seats[key] = v;
  else delete state.seats[key];
  saveState();renderSeat();closeModal();
}
function clearSeat(){
  if(!confirm('清空所有座位安排?'))return;
  state.seats = {};saveState();renderSeat();showToast('已清空');
}
function autoSeat(){
  if(!confirm('将自动按学号顺序排座,当前安排将被覆盖,继续?'))return;
  state.seats = {};
  for(let r=0;r<6;r++){
    for(let c=0;c<7;c++){
      const idx = r*7+c;
      if(idx<state.students.length) state.seats[r+'_'+c] = state.students[idx].id;
    }
  }
  saveState();renderSeat();showToast('已自动排座');
}
async function exportSeatImg(){
  const board = document.getElementById('seatBoard');
  showToast('正在生成图片...');
  try{
    const canvas = await html2canvas(board,{backgroundColor:'#f8fafc',scale:2});
    canvas.toBlob(blob=>{
      saveAs(blob, state.classInfo.name+'-座位表.png');
      showToast('已导出');
    });
  }catch(e){showToast('导出失败,请重试')}
}

          <span class="text-muted" style="font-size:12px">${n.date}</span>
        </div>

function addTodo(){
  const title = document.getElementById('todoInput').value.trim();
  if(!title){return}
  state.todos.push({
    id: 'TD'+Date.now(),
    title,
    due: document.getElementById('todoDate').value||'未设置',
    priority: document.getElementById('todoPri').value,
    done: false
  });
  document.getElementById('todoInput').value = '';
  saveState();renderTodo();showToast('已添加');
}
function toggleTodo(tid){
  const t = state.todos.find(x=>x.id===tid);
  t.done = !t.done;
  saveState();renderTodo();
}
function delTodo(tid){
  state.todos = state.todos.filter(t=>t.id!==tid);
  saveState();renderTodo();showToast('已删除');
}
function addNote(){
  const title = document.getElementById('noteTitle').value.trim();
  const content = prompt('请输入笔记内容:');
  if(!title||!content)return;
  state.notes.push({id:'N'+Date.now(), date: todayStr(), title, content});
  saveState();renderTodo();showToast('已添加');
}
function delNote(nid){
  state.notes = state.notes.filter(n=>n.id!==nid);
  saveState();renderTodo();showToast('已删除');
}

let hotVideoCache = null;
async function loadHotVideo(forceRefresh){
  const list = document.getElementById('hotvideoList');
  const meta = document.getElementById('hotvideoMeta');
  if(!list) return;
  if(!forceRefresh && hotVideoCache){
    renderHotVideoList(hotVideoCache);
    return;
  }
  list.innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>正在从 B 站获取热门视频...</div>';
  try {
    const resp = await fetch('/api/bilibili/hot', { cache: 'no-store' });
    const data = await resp.json();
    hotVideoCache = data;
    renderHotVideoList(data);
    if(meta){
      const src = resp.headers.get('X-Data-Source') === 'fallback' ? '示例数据' : 'B 站实时';
      const t = new Date();
      meta.textContent = `${src} · 更新于 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
    }
  } catch (err) {
    list.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>加载失败,请检查网络后重试<br><br><button class="btn btn-primary" onclick="loadHotVideo(true)">重试</button></div>`;
  }
}

function renderHotVideoList(videos){
  const list = document.getElementById('hotvideoList');
  if(!videos || videos.length === 0){
    list.innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i>暂无视频数据</div>';
    return;
  }
  list.innerHTML = videos.map((v, idx) => {
    const rankBadge = idx < 3
      ? `<span class="hot-rank top3">${idx+1}</span>`
      : `<span class="hot-rank">${idx+1}</span>`;
    const playNum = formatNum(v.play);
    const likeNum = formatNum(v.like || 0);
    const cover = v.pic || `https://picsum.photos/seed/${v.bvid || idx}/320/180`;
    return `
      <div class="hot-card" onclick="window.open('${escapeAttr(v.url)}','_blank')">
        <div class="hot-cover">
          <img src="${escapeAttr(cover)}" alt="${escapeAttr(v.title)}" loading="lazy" onerror="this.src='https://picsum.photos/seed/${idx}/320/180'">
          ${rankBadge}
          <span class="hot-duration">${v.duration||'--'}</span>
        </div>
        <div class="hot-info">
          <div class="hot-title">${escapeHTML(v.title)}</div>
          <div class="hot-meta">
            <span><i class="fa-solid fa-user"></i> ${escapeHTML(v.author||'匿名')}</span>
            ${v.tname?`<span class="hot-tag">${escapeHTML(v.tname)}</span>`:''}
          </div>
          <div class="hot-stats">
            <span><i class="fa-solid fa-play"></i> ${playNum}</span>
            <span><i class="fa-solid fa-thumbs-up"></i> ${likeNum}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return String(s||'').replace(/"/g,'&quot;')}
function formatNum(n){
  if(!n||n<0) return '0';
  if(n>=10000) return (n/10000).toFixed(1)+'万';
  if(n>=1000) return (n/1000).toFixed(1)+'k';
  return String(n);
}

  const reader = new FileReader();
  reader.onload = e=>{

      saveState();renderData();showToast('恢复成功');

}

        <p class="text-muted">基于纯前端技术构建,数据保存在浏览器本地( localStorage ),刷新不丢失。</p>
        <p class="text-muted">支持:Excel 导入导出、Word 文档导出、图片导出、全量备份恢复。</p>
      </div>
    </div>
  `;
}
function saveSettings(){
  state.classInfo.name = document.getElementById('set_class').value;
  state.classInfo.teacher = document.getElementById('set_teacher').value;
  state.classInfo.count = Number(document.getElementById('set_count').value);
  document.getElementById('className').textContent = state.classInfo.name;
  document.getElementById('teacherInfo').textContent = `${state.classInfo.teacher} · ${state.classInfo.count}人`;
  saveState();showToast('已保存');
}

/* ===================== PWA ===================== */
// 注册 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    // SW 路径: 生产环境用根路径,本地子路径自动适应
    const swPath = location.pathname.includes('/teacher-platform/') ? '/teacher-platform/sw.js' : '/sw.js';
    navigator.serviceWorker.register(swPath)
      .then(reg => console.log('[SW] Registered:', reg.scope))
      .catch(err => console.warn('[SW] Failed:', err));
  });
  // 监听更新提示
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (window._swUpdating) showToast('新版本已激活,刷新可获取最新内容');
  });
}

/* ===================== 启动 ===================== */
function init(){
  saveState();
  document.getElementById('todayDate').textContent = today();
  buildNav();
  goPage('dashboard');
  // 移动端
  document.getElementById('menuToggle').onclick = ()=>document.getElementById('sidebar').classList.toggle('open');
  // 点击modal外部关闭
  document.getElementById('modal').onclick = e=>{
    if(e.target.id==='modal') closeModal();
  };
  // 处理 PWA shortcuts
  handlePWAShortcuts();
}

// 处理从主屏幕图标启动时的 shortcut 参数
function handlePWAShortcuts(){
  const params = new URLSearchParams(location.search);
  const action = params.get('action');
  if(action){
    const map = {leave:'leave', score:'score_input', students:'students_list'};
    const page = map[action];
    if(page) setTimeout(()=>goPage(page), 100);
  }
}
init();
</script>
